# Publishes to npm when the version in package.json is not on npm yet, then tags the
# commit (vX.Y.Z). Runs on pushes to main that change package.json, and by hand.
# The first version is published by hand (npm publish); after that, set up npm trusted
# publishing for this repository and workflow (npmjs.com > @tiagojct/subsub > Settings).
name: release
on:
  push:
    branches: [main]
    paths: [package.json]
  workflow_dispatch:
jobs:
  npm:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org
      - id: version
        run: |
          v=$(node -p "require('./package.json').version")
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if ! npm view @tiagojct/subsub version > /dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "@tiagojct/subsub is not on npm yet: publish the first version by hand."
          elif npm view "@tiagojct/subsub@$v" version > /dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "@tiagojct/subsub $v is already on npm; nothing to publish."
          fi
      # The unit tests run first: they also stop a release when the site's Models page and the
      # published model-test results differ.
      - if: steps.version.outputs.skip != 'true'
        run: npm install -g npm@11.21.2 && npm ci && npm run build && npm test && npm publish --provenance --access public
      - if: steps.version.outputs.skip != 'true'
        run: |
          v=${{ steps.version.outputs.version }}
          git ls-remote --exit-code --tags origin "refs/tags/v$v" > /dev/null || (git tag "v$v" && git push origin "v$v")
      # A GitHub release, with the version's section of CHANGELOG.md as notes. Zenodo archives
      # each release and gives it a DOI (the concept DOI in CITATION.cff covers all versions).
      - if: steps.version.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=${{ steps.version.outputs.version }}
          awk -v v="$v" '$0 ~ "^## "v" " {on=1; next} /^## / && on {exit} on' CHANGELOG.md > notes.md
          gh release view "v$v" > /dev/null 2>&1 || gh release create "v$v" --title "Sub-Sub $v" --notes-file notes.md
