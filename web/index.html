<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="color-scheme" content="light dark">
	<title>Sub-Sub</title>
	<link rel="icon" href="/icon.svg" type="image/svg+xml">
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Courier+Prime:ital,wght@0,400;0,700;1,400&family=EB+Garamond:ital,wght@0,400..800;1,400..800&family=JetBrains+Mono:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,400..700;1,6..72,400..700&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="/glauca.css">
	<link rel="stylesheet" href="/app.css">
	<script type="module" src="/app.js"></script>
</head>
<body data-mode="researcher">
	<div class="app">
		<header class="top">
			<button type="button" class="ghost menu-btn" id="menu-btn" aria-controls="side" aria-expanded="true" title="Toggle catalog sidebar"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M9 3v18"/></svg> <span data-i18n="menu">Menu</span></button>
			<div class="brand"><span class="mark" aria-hidden="true"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1-2.5-2.5Z"/><path d="M6 6h10"/><path d="M6 10h10"/></svg></span> Sub-Sub</div>
			<div class="modes" role="group" aria-label="Mode">
				<button type="button" data-mode="researcher" aria-pressed="true" data-i18n="researcher">Researcher</button>
				<button type="button" data-mode="librarian" aria-pressed="false" data-i18n="librarian">Librarian</button>
			</div>
			<div class="status">
				<span class="library" id="library"><span class="library-dot" aria-hidden="true"></span><span class="library-text"></span></span>
				<label class="profile"><span class="visually-hidden" data-i18n="profile">Profile</span>
					<select id="profile">
						<option value="reader">Reader</option>
						<option value="scholar">Scholar</option>
						<option value="author">Author</option>
						<option value="editor">Editor</option>
					</select>
				</label>
				<button type="button" class="ghost model-btn" id="model-btn"></button>
				<button type="button" class="ghost width-btn" id="width-btn" aria-label="Toggle wide layout" title="Toggle wide layout"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="15 3 21 3 21 9"/><polyline points="9 21 3 21 3 15"/><line x1="21" x2="14" y1="3" y2="10"/><line x1="3" x2="10" y1="21" y2="14"/></svg> <span id="width-btn-text">Wide</span></button>
				<button type="button" class="ghost theme-btn" id="theme-btn" aria-label="Toggle theme" title="Toggle theme"></button>
			</div>
		</header>

		<aside class="side" id="side">
			<button type="button" class="primary block" id="new-btn" data-i18n="newConversation">New conversation</button>
			<section class="phone-only settings">
				<label><span data-i18n="profile">Profile</span>
					<select id="profile-side">
						<option value="reader">Reader</option>
						<option value="scholar">Scholar</option>
						<option value="author">Author</option>
						<option value="editor">Editor</option>
					</select>
				</label>
				<label><span data-i18n="model">Model</span>
					<button type="button" class="secondary model-btn" id="model-btn-side"></button>
				</label>
				<label><span data-i18n="theme">Theme</span>
					<button type="button" class="secondary theme-btn" id="theme-btn-side"></button>
				</label>
			</section>
			<section>
				<h2 data-i18n="actions">Actions</h2>
				<div class="actions" id="actions"></div>
			</section>
			<section class="grow">
				<div class="side-subhead">
					<h2 data-i18n="conversations">Conversations</h2>
					<button type="button" class="ghost small" id="export-btn" title="Export conversation as Markdown" data-i18n="export">Export</button>
				</div>
				<div class="search-wrap">
					<input type="search" id="session-search" placeholder="Search conversations..." autocomplete="off">
				</div>
				<ul class="sessions" id="sessions"></ul>
			</section>
			<footer class="side-foot">
				<button type="button" class="ghost small" id="quit-btn" data-i18n="quit">Close Sub-Sub</button>
				<span class="version" id="version"></span>
			</footer>
		</aside>

		<main class="chat" id="main">
			<div class="banner" id="banner" hidden></div>
			<div class="log" id="log" aria-live="polite"></div>
			<form class="composer" id="composer">
				<div class="suggest" id="suggest" role="listbox" hidden></div>
				<textarea id="input" rows="2" autocomplete="off" spellcheck="true"></textarea>
				<div class="composer-buttons">
					<button type="button" class="secondary" id="stop" hidden data-i18n="stop">Stop</button>
					<button type="submit" class="primary" id="send" data-i18n="send">Send</button>
				</div>
			</form>
		</main>
	</div>

	<dialog id="dialog" class="modal">
		<form method="dialog" id="dialog-form">
			<h2 id="dialog-title"></h2>
			<p class="hint" id="dialog-hint"></p>
			<pre class="preview" id="dialog-message"></pre>
			<div id="dialog-body"></div>
			<div class="modal-buttons" id="dialog-buttons"></div>
		</form>
	</dialog>

	<dialog id="model-dialog" class="modal wide">
		<div class="modal-head">
			<h2 data-i18n="modelTitle">Model</h2>
			<button type="button" class="ghost small" id="model-close" data-i18n="close">Close</button>
		</div>
		<h3 data-i18n="chooseModel">Choose a model</h3>
		<label class="check"><input type="checkbox" id="model-both" checked> <span data-i18n="forBoth">Use it in both modes</span></label>
		<ul class="models" id="models"></ul>
		<h3 data-i18n="connectProvider">Connect a provider</h3>
		<form id="login-form" class="login">
			<label><span data-i18n="provider">Provider</span>
				<select id="login-provider"></select>
			</label>
			<label><span data-i18n="apiKey">API key</span>
				<input type="password" id="login-key" autocomplete="off" spellcheck="false" required>
			</label>
			<p class="small"><a id="login-link" href="#" target="_blank" rel="noopener noreferrer" data-i18n="getKey">Get a key</a></p>
			<p class="small muted" data-i18n="keyNote"></p>
			<div class="modal-buttons"><button type="submit" class="primary" id="login-save" data-i18n="save">Save</button></div>
			<p class="small muted" data-i18n="oauthNote"></p>
		</form>
	</dialog>
</body>
</html>
