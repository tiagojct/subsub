<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="color-scheme" content="light dark">
	<title>Sub-Sub</title>
	<link rel="icon" href="/icon.svg" type="image/svg+xml">
	<link rel="preload" href="/fonts/IBMPlexSans.woff2" as="font" type="font/woff2" crossorigin>
	<link rel="stylesheet" href="/app.css">
	<script type="module" src="/app.js"></script>
</head>
<body data-mode="researcher">
	<div class="app">
		<header class="top">
			<button type="button" class="icon-btn" id="menu-btn" aria-controls="side" aria-expanded="true" data-i18n-title="menu" title="Menu"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="4.5" width="17" height="15" rx="2"/><path d="M9.5 4.5v15"/></svg><span class="visually-hidden" data-i18n="menu">Menu</span></button>
			<div class="brand"><svg class="mark" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="1.5"/><path d="M6.5 9h7M6.5 12h11"/><circle cx="12" cy="16" r="1.1"/></svg><span>Sub<span class="hyphen">-</span>Sub</span></div>
			<div class="modes" role="group" aria-label="Mode">
				<button type="button" data-mode="researcher" aria-pressed="true" data-i18n="researcher">Researcher</button>
				<button type="button" data-mode="librarian" aria-pressed="false" data-i18n="librarian">Librarian</button>
			</div>
			<div class="status">
				<span class="library" id="library"><span class="library-dot" aria-hidden="true"></span><span class="library-text"></span></span>
				<label class="profile wide-only"><span class="visually-hidden" data-i18n="profile">Profile</span>
					<select id="profile">
						<option value="reader">Reader</option>
						<option value="scholar">Scholar</option>
						<option value="author">Author</option>
						<option value="editor">Editor</option>
					</select>
				</label>
				<button type="button" class="chip-btn model-btn wide-only" id="model-btn"></button>
				<button type="button" class="icon-btn wide-only" id="width-btn" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12h16M4 12l3.5-3.5M4 12l3.5 3.5M20 12l-3.5-3.5M20 12l-3.5 3.5"/></svg><span class="visually-hidden" id="width-btn-text">Wide</span></button>
				<button type="button" class="icon-btn" id="theme-btn"></button>
			</div>
		</header>

		<aside class="side" id="side">
			<button type="button" class="new-btn" id="new-btn"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg><span data-i18n="newConversation">New conversation</span></button>
			<section class="phone-only settings">
				<label><span data-i18n="profile">Profile</span>
					<select id="profile-side">
						<option value="reader">Reader</option>
						<option value="scholar">Scholar</option>
						<option value="author">Author</option>
						<option value="editor">Editor</option>
					</select>
				</label>
				<label><span data-i18n="model">Model</span>
					<button type="button" class="secondary model-btn" id="model-btn-side"></button>
				</label>
				<label><span data-i18n="theme">Theme</span>
					<button type="button" class="secondary" id="theme-btn-side"></button>
				</label>
			</section>
			<section>
				<h2 data-i18n="actions">Actions</h2>
				<div class="actions" id="actions"></div>
			</section>
			<section class="grow">
				<div class="side-subhead">
					<h2 data-i18n="conversations">Conversations</h2>
					<button type="button" class="link-btn" id="export-btn" data-i18n="export" data-i18n-title="exportTitle">Export</button>
				</div>
				<input type="search" id="session-search" class="search" data-i18n-placeholder="searchConversations" placeholder="Search conversations" autocomplete="off">
				<ul class="sessions" id="sessions"></ul>
			</section>
			<footer class="side-foot">
				<label class="switch" id="starbuck-label"><input type="checkbox" role="switch" id="starbuck-toggle"><span class="track" aria-hidden="true"></span><span data-i18n="starbuck">Reference checks (Starbuck)</span></label>
				<div class="side-foot-row">
					<button type="button" class="link-btn" id="quit-btn" data-i18n="quit">Close Sub-Sub</button>
					<span class="version" id="version"></span>
				</div>
			</footer>
		</aside>

		<main class="chat" id="main">
			<div class="banner" id="banner" hidden></div>
			<div class="log" id="log" aria-live="polite"></div>
			<form class="composer" id="composer">
				<div class="suggest" id="suggest" role="listbox" hidden></div>
				<div class="composer-box">
					<textarea id="input" rows="1" autocomplete="off" spellcheck="true"></textarea>
					<div class="composer-row">
						<span class="composer-hint" data-i18n="composerHint">Enter to send, Shift+Enter for a new line, / for commands</span>
						<div class="composer-buttons">
							<button type="button" class="secondary" id="stop" hidden data-i18n="stop">Stop</button>
							<button type="submit" class="primary" id="send" data-i18n="send">Send</button>
						</div>
					</div>
				</div>
			</form>
		</main>
	</div>

	<dialog id="dialog" class="modal">
		<form method="dialog" id="dialog-form">
			<p class="modal-kicker" id="dialog-kicker"></p>
			<h2 id="dialog-title"></h2>
			<p class="hint" id="dialog-hint"></p>
			<pre class="preview" id="dialog-message"></pre>
			<div id="dialog-body"></div>
			<div class="modal-buttons" id="dialog-buttons"></div>
		</form>
	</dialog>

	<dialog id="model-dialog" class="modal wide">
		<div class="modal-head">
			<h2 data-i18n="modelTitle">Model</h2>
			<button type="button" class="link-btn" id="model-close" data-i18n="close">Close</button>
		</div>
		<h3 data-i18n="chooseModel">Choose a model</h3>
		<label class="check"><input type="checkbox" id="model-both"> <span data-i18n="forBoth">Use it in both modes</span></label>
		<input type="search" id="model-search" class="model-search" data-i18n-placeholder="searchModels" placeholder="Search models" autocomplete="off" spellcheck="false">
		<ul class="models" id="models"></ul>
		<h3 data-i18n="connectProvider">Connect a provider</h3>
		<form id="login-form" class="login">
			<label><span data-i18n="provider">Provider</span>
				<select id="login-provider"></select>
			</label>
			<label><span data-i18n="apiKey">API key</span>
				<input type="password" id="login-key" autocomplete="off" spellcheck="false" required>
			</label>
			<p class="small"><a id="login-link" href="#" target="_blank" rel="noopener noreferrer" data-i18n="getKey">Get a key</a></p>
			<p class="small free-note" id="login-free" hidden></p>
			<p class="small muted" data-i18n="keyNote"></p>
			<div class="modal-buttons"><button type="submit" class="primary" id="login-save" data-i18n="save">Save</button></div>
			<p class="small muted" data-i18n="oauthNote"></p>
		</form>
	</dialog>
</body>
</html>
